services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_change_this}
      POSTGRES_DB: ${POSTGRES_DB:-retail}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retail}"]
      interval: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/outputs/uploads
      REPORTS_DIR: /app/outputs/reports
      CHROMA_DIR: /app/outputs/chroma
      HF_HOME: /app/outputs/model_cache
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "5173:80"
volumes:
  postgres_data:
