version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: enterprise-retail-postgres
    restart: always
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: secure_retail_password_2026
      POSTGRES_DB: retail_copilot_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_copilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  retail-copilot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: enterprise-retail-copilot
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://retail_user:secure_retail_password_2026@postgres:5432/retail_copilot_db
      - CHROMA_PERSIST_DIRECTORY=./data/chroma_db
      - SECRET_KEY=enterprise-retail-copilot-production-key-2026
      - DEFAULT_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
    volumes:
      - copilot_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: enterprise-retail-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - retail-copilot

volumes:
  pg_data:
  copilot_data:
